name: Generate Harness Lockfile

on:
  push:
    branches:
      - agent/harness-navigator-p0
    paths:
      - harness/package.json
      - .github/workflows/harness-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/harness-navigator-p0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Generate exact npm lock
        run: npm install --prefix harness --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock when changed
        run: |
          if [ -n "$(git status --porcelain -- harness/package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add harness/package-lock.json
            git commit -m "chore: lock Harness runtime dependencies"
            git push origin HEAD:agent/harness-navigator-p0
          fi
