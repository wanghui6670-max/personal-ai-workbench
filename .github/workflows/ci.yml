name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Syntax check all runtime surfaces
        run: |
          node --check src/server.mjs
          node --check src/product.mjs
          node --check src/request-validation.mjs
          node --check src/domain.mjs
          node --check src/domain-core.mjs
          node --check src/today-domain.mjs
          node --check src/workbench-core.mjs
          node --check src/store.mjs
          node --check src/inbox-ack.mjs
          node --check src/inbox-domain.mjs
          node --check src/capture-contract.mjs
          node --check src/capture-receipts.mjs
          node --check src/capture-domain.mjs
          node --check src/receipt-backup.mjs
          node --check src/feishu.mjs
          node --check src/feishu-capture.mjs
          node --check src/feishu-daily-journal.mjs
          node --check src/task-cli.mjs
          node --check src/local-calendar.mjs
          node --check src/task-sync-domain.mjs
          node --check src/project-directory.mjs
          node --check src/project-record-contract.mjs
          node --check src/project-record-policy.mjs
          node --check src/project-sync-coordinator.mjs
          node --check src/project-identity.mjs
          node --check src/joycrew-client.mjs
          node --check src/joycrew-actions.mjs
          node --check src/host-p0.mjs
          node --check src/macos-bootstrap.mjs
          node --check src/mcp/registry.mjs
          node --check src/mcp/tools.mjs
          node --check src/mcp/project-record-tools.mjs
          node --check src/mcp/external-task-tools.mjs
          node --check src/mcp/joycrew-tools.mjs
          node --check src/harness-auth.mjs
          node --check src/harness-policy.mjs
          node --check src/harness-navigator.mjs
          node --check src/harness-http.mjs
          node --check harness/joycrew-schema.mjs
          node --check harness/joycrew-mcp-server.mjs
          node --check harness/joycrew-sdk-server.mjs
          node --check harness/runtime-bin.mjs
          node --check scripts/doctor.mjs
          node --check scripts/migrate-project-records.mjs
          node --check scripts/test-by-file.mjs
          node --check scripts/harness-check.mjs
          node --check scripts/harness-e2e.mjs
          node --check scripts/p0-deployment-acceptance.mjs
          node --check scripts/p0-host-preflight.mjs
          node --check scripts/macos-bootstrap.mjs
          node --check scripts/macos-launch-agent.mjs
          bash -n install-macos.command
          node --check public/project-records.js
          node --check public/ux-enhancements.js
          node --check public/getnote-integration.js
          node --check public/harness-navigator.js
          node --check public/joycrew-integration.js
      - name: Run all Workbench contract tests
        env:
          OPENAI_API_KEY: ''
          AI_PROVIDER_ENABLED: '0'
          HARNESS_ENABLED: '0'
          JOYCREW_ENABLED: '0'
        run: npm run test:files

  harness-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install pinned isolated Harness runtime
        run: npm run harness:install
      - name: Compile unified Copilot composition
        run: npm run harness:check
      - name: Run deterministic Agent-to-tool end-to-end
        run: npm run harness:e2e

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build production image with Harness runtime
        run: docker build -t personal-ai-workbench:v2 .
      - name: Initialize Harness inside production image
        run: docker run --rm --entrypoint node personal-ai-workbench:v2 scripts/harness-check.mjs
      - name: Start unified Workbench with Joycrew disabled and verify fail-isolation
        run: |
          set -euo pipefail
          docker run -d --name workbench-v2-smoke -p 127.0.0.1:49173:49173 -e PORT=49173 -e ALLOW_INSECURE_PUBLIC=1 -e JOYCREW_ENABLED=0 personal-ai-workbench:v2
          trap 'docker rm -f workbench-v2-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:49173/api/health >/tmp/workbench-health.json; then break; fi
            if [ "$attempt" -eq 40 ]; then
              docker logs workbench-v2-smoke || true
              exit 1
            fi
            sleep 1
          done
          node -e "const fs=require('node:fs'); const value=JSON.parse(fs.readFileSync('/tmp/workbench-health.json','utf8')); if(value.ok!==true||value.version!=='2.0.0') throw new Error('unexpected health response');"
          curl --fail --silent http://127.0.0.1:49173/harness-navigator.js | grep 'Navigator'
          curl --fail --silent http://127.0.0.1:49173/joycrew-integration.js | grep '业务执行'
          curl --fail --silent http://127.0.0.1:49173/api/joycrew/status >/tmp/joycrew-status.json
          node -e "const fs=require('node:fs'); const value=JSON.parse(fs.readFileSync('/tmp/joycrew-status.json','utf8')); if(value.joycrew?.enabled!==false) throw new Error('Joycrew fail-isolation contract changed');"
