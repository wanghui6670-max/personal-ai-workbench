# Keyless employee runtime composition used only by CI/local verification.
- id: employee-sdk-server
  name: './employee-sdk-server.mjs'
  config:
    maxTokensAsSuccess: false

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.EMPLOYEE_SYSTEM_PROMPT

- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    mode: native

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    maxParallelToolCalls: 1
    agents: []

- id: llm-replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    file: !!js process.env.DSH_SNAPSHOT_FILE
    overrideFile: !!js process.env.DSH_SNAPSHOT_OVERRIDE
    providers:
      - id: employee
        name: Employee Replay
        models:
          - id: employee-replay
            name: Employee Replay
            contextWindow: 32768
            defaultMaxTokens: 512
