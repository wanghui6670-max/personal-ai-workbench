# DeepSeek Harness employee runtime.
# The per-employee persona is supplied by the parent sidecar through a minimal
# child environment. No shell, filesystem, arbitrary web, MCP or mutation
# plugin is mounted in this first execution slice.

- id: employee-sdk-server
  name: './employee-sdk-server.mjs'
  config:
    maxTokensAsSuccess: false

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.EMPLOYEE_SYSTEM_PROMPT

- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    mode: native

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    maxParallelToolCalls: !!js Number(process.env.EMPLOYEE_MAX_PARALLEL_TOOL_CALLS || 1)
    agents: []

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      employee:
        displayName: Joycrew Employee Provider
        apiKeyEnv: HARNESS_PROVIDER_API_KEY
        api: !!js process.env.HARNESS_PROVIDER_API
        baseURL: !!js process.env.HARNESS_PROVIDER_BASE_URL
        models:
          - id: !!js process.env.HARNESS_PROVIDER_MODEL
            name: !!js process.env.HARNESS_PROVIDER_MODEL
            contextWindow: !!js Number(process.env.HARNESS_PROVIDER_CONTEXT_WINDOW)
            maxTokens: !!js Number(process.env.HARNESS_PROVIDER_MAX_TOKENS)
