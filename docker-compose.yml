services:
  workbench:
    build:
      context: .
    user: "${WORKBENCH_UID:-1000}:${WORKBENCH_GID:-1000}"
    ports:
      - "${WORKBENCH_BIND_ADDRESS:-127.0.0.1}:${WORKBENCH_PORT:-4173}:${WORKBENCH_PORT:-4173}"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "${WORKBENCH_PORT:-4173}"
      DATA_DIR: /data
      WORKSPACE_ROOT: /workspace
    # Allows JOYCREW_BASE_URL=http://host.docker.internal:4000 when Joycrew
    # runs on the same host. Authentication remains server-to-server.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${WORKBENCH_DATA_PATH:-./data}
        target: /data
      # Read-write is required: the app creates project folders and PROJECT.md files.
      - type: bind
        source: ${WORKBENCH_WORKSPACE_PATH:-./workspace}
        target: /workspace
        read_only: false
    restart: unless-stopped

  # Optional. Start explicitly with:
  # docker compose --profile employee-runtime up -d --build
  # Joycrew can then use http://host.docker.internal:${EMPLOYEE_HARNESS_PORT:-4300}
  # (or another approved private route) as DEEPSEEK_HARNESS_URL.
  employee-harness-runtime:
    profiles: ["employee-runtime"]
    build:
      context: .
    user: "${WORKBENCH_UID:-1000}:${WORKBENCH_GID:-1000}"
    ports:
      - "${EMPLOYEE_HARNESS_BIND_ADDRESS:-127.0.0.1}:${EMPLOYEE_HARNESS_PORT:-4300}:${EMPLOYEE_HARNESS_PORT:-4300}"
    env_file:
      - path: .env
        required: false
    environment:
      EMPLOYEE_HARNESS_HOST: 0.0.0.0
      EMPLOYEE_HARNESS_PORT: "${EMPLOYEE_HARNESS_PORT:-4300}"
      EMPLOYEE_HARNESS_ALLOW_PRIVATE_BIND: "1"
    command: ["node", "harness/employee-runtime-server.mjs"]
    restart: unless-stopped
