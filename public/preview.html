<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>动觉 AI 工作台 · 打开入口</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #17191d; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(460px, 100%); background: #fff; border: 1px solid #e6e8ec; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(24, 31, 45, .06); }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #1d5cff; margin: 0 0 8px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 12px; color: #4b5563; line-height: 1.65; font-size: 14px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 8px 16px; border-radius: 10px; background: #1d5cff; color: #fff; text-decoration: none; font-weight: 700; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #eef1f6; padding: 1px 5px; border-radius: 5px; }
    .note { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #fff7e8; color: #7a4b00; font-size: 13px; line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <p class="kicker">LOCAL WORKBENCH</p>
      <h1>请在系统浏览器打开工作台</h1>
      <p>对话预览是跨域 iframe。正式工作台禁止被嵌套，所以这里如果打开首页会整页空白。这不是服务挂了。</p>
      <p>请打开 <code>http://127.0.0.1:8080</code>（无需密码）。</p>
      <a class="btn" href="http://127.0.0.1:8080/" target="_blank" rel="noopener">打开工作台</a>
      <div class="note">如果浏览器已经打开但仍是白屏，强制刷新一次：Mac 上用 Command + Shift + R。</div>
    </section>
  </main>
</body>
</html>
