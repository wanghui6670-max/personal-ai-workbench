<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>用户管理 - 动觉 AI 工作台</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{background:var(--bg);padding:32px 20px}
    .users-wrap{max-width:720px;margin:0 auto}
    .users-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    .users-head h1{font-size:22px;margin:0}
    .users-head .back{font-size:13px;color:var(--accent);text-decoration:none}
    .search-bar{display:flex;gap:8px;margin-bottom:16px}
    .search-bar input{flex:1;padding:9px 14px;border:1px solid var(--line);border-radius:8px;font-size:13px}
    .search-bar .btn{white-space:nowrap}
    .batch-bar{display:none;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:12px}
    .batch-bar .batch-count{font-size:13px;font-weight:600;flex:1}
    .batch-bar .btn{font-size:12px;padding:6px 14px}
    .user-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
    .user-checkbox{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);flex:none}
    .user-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
    .user-info{flex:1;min-width:0}
    .user-info .name{font-size:15px;font-weight:600}
    .user-info .meta{font-size:12px;color:var(--muted);margin-top:2px}
    .user-info .role-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin-left:6px}
    .role-badge.admin{background:#fee;color:var(--danger)}
    .role-badge.user{background:var(--accent-soft);color:var(--accent)}
    .user-actions{display:flex;gap:8px;flex:none}
    .form-row{display:flex;gap:12px;margin-bottom:16px}
    .form-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
    .form-row select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
    .add-user-form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
    .add-user-form h3{margin:0 0 16px;font-size:16px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s}
    .toast.show{opacity:1}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:100}
    .modal-box{background:#fff;border-radius:16px;padding:24px;width:min(400px,90vw);box-shadow:var(--shadow)}
    .modal-box h3{margin:0 0 12px;font-size:17px}
    .modal-box input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin-bottom:12px}
    .modal-box .field-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;margin-top:4px}
    .modal-box .field-label:first-of-type{margin-top:0}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .data-modal{background:#fff;border-radius:16px;padding:0;width:min(720px,92vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
    .data-modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .data-modal-head h3{margin:0;font-size:17px}
    .data-modal-head .close-btn{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;padding:0 4px}
    .data-modal-body{padding:16px 24px 20px;overflow-y:auto;flex:1}
    .data-section{margin-bottom:20px}
    .data-section h4{margin:0 0 10px;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:8px}
    .data-section h4 .count{font-size:12px;color:var(--muted);font-weight:400}
    .data-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
    .data-item:last-child{border-bottom:0}
    .data-item .item-title{font-weight:500}
    .data-item .item-meta{font-size:11px;color:var(--muted);margin-top:2px}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
    .stat-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center}
    .stat-box .num{font-size:20px;font-weight:700;color:var(--accent)}
    .stat-box .label{font-size:11px;color:var(--muted);margin-top:2px}
    .pill-sm{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;margin-left:4px}
    .pill-sm.done{background:#e8f5e9;color:#2e7d32}
    .pill-sm.pending{background:var(--accent-soft);color:var(--accent)}
    .pill-sm.overdue{background:#fee;color:var(--danger)}
    .empty-data{color:var(--muted);font-size:13px;padding:12px 0;text-align:center}
  </style>
</head>
<body>
  <div class="users-wrap">
    <div class="users-head">
      <h1>用户管理</h1>
      <a class="back" href="/">&larr; 返回工作台</a>
    </div>
    <div class="search-bar">
      <input id="search-input" placeholder="搜索用户名或显示名称…" autocomplete="off">
      <button class="btn" id="select-all-btn">全选</button>
    </div>
    <div class="batch-bar" id="batch-bar">
      <span class="batch-count">已选择 0 个用户</span>
      <button class="btn danger" id="batch-delete-btn">批量删除</button>
    </div>
    <div id="users-list"></div>
    <div class="add-user-form">
      <h3>添加用户</h3>
      <div class="form-row">
        <input id="new-username" placeholder="用户名" autocomplete="off">
        <input id="new-display-name" placeholder="显示名称（可选）" autocomplete="off">
        <input id="new-password" type="password" placeholder="密码" autocomplete="new-password">
        <select id="new-role">
          <option value="member">普通用户</option>
          <option value="admin">管理员</option>
        </select>
        <button class="btn primary" id="add-user-btn">添加</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/users.js"></script>
</body>
</html>
